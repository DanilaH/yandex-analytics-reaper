[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "yandex-analytics-reaper"
version = "0.1.1"
description = "Private market-intelligence tooling for Yandex Games opportunity discovery and candidate evaluation."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "httpx>=0.28,<1",
  "pydantic>=2.11,<3",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.17,<2",
  "pytest>=8.4,<9",
  "pytest-cov>=6.2,<7",
  "ruff>=0.12,<1",
]

[project.scripts]
yandex-reaper = "yandex_analytics_reaper.cli:main"
yandex-reaper-analyst = "yandex_analytics_reaper.analyst_cli:main"
yandex-reaper-experiment = "yandex_analytics_reaper.experiment_cli:main"
yandex-reaper-taxonomy = "yandex_analytics_reaper.taxonomy_execution_cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]
warn_unused_configs = true
