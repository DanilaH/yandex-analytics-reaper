name: Fresh Microhit Anomaly Sweep V1 2026-09-02

on:
  push:
    branches:
      - research/fresh-microhit-anomaly-sweep-v1-2026-09-02
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Reaper
        run: |
          python -m pip install -e .
          python -m pip install pytest

      - name: Verify remote protocol retry handling
        run: python -m pytest tests/test_yandex_client_transport_retry.py -q

      - name: Run fresh microhit anomaly sweep
        run: |
          set -o pipefail
          yandex-reaper-experiment run research/fresh-microhit-anomaly-sweep-v1-2026-09-02/manifest.json --workers 4 | tee sweep-result.json

      - name: Upload sweep evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fresh-microhit-anomaly-sweep-v1-2026-09-02
          retention-days: 30
          if-no-files-found: warn
          path: |
            sweep-result.json
            research/fresh-microhit-anomaly-sweep-v1-2026-09-02/manifest.json
            artifacts/**
