name: PR B final artifact identity

on:
  push:
    branches:
      - feat/analyst-runner-v1.2-resume

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/analyst-runner-v1.2-resume
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            constraints-dev.txt
      - name: Bind published manifest payload to run state
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          source = Path("src/yandex_analytics_reaper/analyst_workflow.py")
          text = source.read_text(encoding="utf-8")
          old_read = (
              '        with ZipFile(artifact_path, "r") as archive:\n'
              '            summary_bytes = archive.read("execution-summary.json")\n'
              '            manifest_bytes = archive.read("artifact-manifest.json")\n'
          )
          new_read = (
              '        with ZipFile(artifact_path, "r") as archive:\n'
              '            summary_bytes = archive.read("execution-summary.json")\n'
              '            manifest_bytes = archive.read("artifact-manifest.json")\n'
              '            input_manifest_bytes = archive.read("input/manifest.json")\n'
          )
          if text.count(old_read) != 1:
              raise RuntimeError("expected one existing-artifact payload read block")
          text = text.replace(old_read, new_read, 1)

          old_identity = (
              '        or artifact_manifest.experiment_id != state.experiment_id\n'
              '        or artifact_manifest.run_id != state.run_id\n'
          )
          new_identity = (
              '        or artifact_manifest.experiment_id != state.experiment_id\n'
              '        or artifact_manifest.run_id != state.run_id\n'
              '        or _sha256_bytes(input_manifest_bytes) != state.manifest_sha256\n'
          )
          if text.count(old_identity) != 1:
              raise RuntimeError("expected one existing-artifact identity predicate")
          source.write_text(text.replace(old_identity, new_identity, 1), encoding="utf-8")

          tests = Path("tests/test_analyst_workflow.py")
          test_text = tests.read_text(encoding="utf-8").rstrip()
          if "test_existing_final_artifact_binds_manifest_payload_to_run_state" in test_text:
              raise RuntimeError("published artifact identity test already exists")
          addition = (
              "\n\n\ndef test_existing_final_artifact_binds_manifest_payload_to_run_state(tmp_path: Path) -> None:\n"
              "    workdir = tmp_path / \"work\"\n"
              "    (workdir / \"input\").mkdir(parents=True)\n"
              "    persisted_manifest = b'{\"schema_version\":1,\"experiment_id\":\"demo\"}'\n"
              "    authoritative_manifest = persisted_manifest + b' '\n"
              "    (workdir / \"input\" / \"manifest.json\").write_bytes(persisted_manifest)\n"
              "    state = workflow.AnalystExperimentRunState(\n"
              "        experiment_id=\"demo\",\n"
              "        run_id=\"20260901T000000Z\",\n"
              "        started_at=datetime(2026, 9, 1, tzinfo=UTC),\n"
              "        manifest_sha256=workflow._sha256_bytes(authoritative_manifest),\n"
              "    )\n"
              "    digest = \"0\" * 64\n"
              "    summary = workflow.AnalystExperimentExecutionSummary(\n"
              "        workflow_version=\"analyst-experiment-v1.2\",\n"
              "        status=\"completed\",\n"
              "        experiment_id=state.experiment_id,\n"
              "        run_id=state.run_id,\n"
              "        started_at=state.started_at,\n"
              "        completed_at=state.started_at,\n"
              "        manifest_sha256=state.manifest_sha256,\n"
              "        runtime=workflow.AnalystRuntimeProvenance(\n"
              "            package_version=\"0.1.1\", git_sha=None, python=\"3.12\", platform=\"test\"\n"
              "        ),\n"
              "        family_count=1,\n"
              "        query_count=1,\n"
              "        comparable_unique_listing_count=0,\n"
              "        rich_requested_listing_count=0,\n"
              "        rich_observed_listing_count=0,\n"
              "        rich_missing_listing_ids=(),\n"
              "        snapshot_content_hash=digest,\n"
              "        market_export_content_hash=digest,\n"
              "        market_features_content_hash=digest,\n"
              "        final_invocation_mode=\"resume\",\n"
              "        final_invocation_started_at=state.started_at,\n"
              "        final_invocation_workers=1,\n"
              "        was_resumed=True,\n"
              "        reused_query_count=1,\n"
              "        collected_query_count=0,\n"
              "        verifier_status=\"pass\",\n"
              "    )\n"
              "    workflow._write_model(workdir / \"execution-summary.json\", summary)\n"
              "    artifact_manifest = workflow.build_artifact_manifest(\n"
              "        workdir, experiment_id=state.experiment_id, run_id=state.run_id\n"
              "    )\n"
              "    workflow._write_model(workdir / \"artifact-manifest.json\", artifact_manifest)\n"
              "    artifact = tmp_path / \"artifact.zip\"\n"
              "    workflow.package_workdir(workdir, artifact)\n\n"
              "    with pytest.raises(workflow.AnalystExperimentError, match=\"identity\"):\n"
              "        workflow._result_from_existing_artifact(\n"
              "            artifact,\n"
              "            repository_root=tmp_path,\n"
              "            state=state,\n"
              "            invocation_elapsed_seconds=0.0,\n"
              "        )\n"
          )
          tests.write_text(test_text + addition + "\n", encoding="utf-8")
          PY
      - name: Install exact dev environment
        run: |
          python -m pip install "pip==26.2.1"
          pip install -c constraints-dev.txt -e ".[dev]"
      - name: Format
        run: ruff format src/yandex_analytics_reaper/analyst_workflow.py tests/test_analyst_workflow.py
      - name: Ruff
        run: ruff check .
      - name: Mypy
        run: mypy src
      - name: Pytest and coverage
        run: pytest --cov=yandex_analytics_reaper --cov-report=term-missing --cov-fail-under=80
      - name: Commit verified identity hardening
        shell: bash
        run: |
          rm -f .github/workflows/pr-b-final-identity.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "test: bind published artifact to immutable manifest"
          git push origin HEAD:feat/analyst-runner-v1.2-resume
