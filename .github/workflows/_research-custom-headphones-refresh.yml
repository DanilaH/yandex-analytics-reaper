name: Custom Headphones refresh

on:
  push:
    branches:
      - research/custom-headphones-refresh-2026-09-13

permissions:
  contents: read

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            constraints-dev.txt
      - name: Install Reaper
        run: |
          python -m pip install "pip==26.2.1"
          pip install -c constraints-dev.txt -e .
      - name: Run focused thesis
        run: |
          set -o pipefail
          yandex-reaper-thesis run \
            research/custom-headphones-refresh-2026-09-13/suite.json \
            --workers 2 | tee refresh-result.json
      - name: Upload refresh artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: custom-headphones-refresh-2026-09-13
          path: |
            refresh-result.json
            artifacts/
          if-no-files-found: warn
          retention-days: 30
