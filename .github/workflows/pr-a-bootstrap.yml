name: PR A bootstrap

on:
  push:
    branches:
      - feat/analyst-runner-v1.2-observability

permissions:
  contents: write

jobs:
  implement-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/analyst-runner-v1.2-observability
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            constraints-dev.txt
      - name: Apply PR A integration patch
        shell: bash
        run: |
          python - <<'PY'
          import base64, gzip
          payload = ""
          source = gzip.decompress(base64.b64decode(payload)).decode("utf-8")
          exec(compile(source, "pr_a_apply.py", "exec"))
          PY
      - name: Install exact dev environment
        run: |
          python -m pip install "pip==26.2.1"
          pip install -c constraints-dev.txt -e ".[dev]"
      - name: Ruff
        run: ruff check .
      - name: Mypy
        run: mypy src
      - name: Pytest and coverage
        run: pytest --cov=yandex_analytics_reaper --cov-report=term-missing --cov-fail-under=80
      - name: Commit verified implementation
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "feat: make analyst experiments observable"
          git push origin HEAD:feat/analyst-runner-v1.2-observability
