name: Apply point observation review fixes

on:
  push:
    branches:
      - feature/r0.4-p1-point-observation
    paths:
      - .github/workflows/_patch-point-observation-review.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feature/r0.4-p1-point-observation
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Patch review findings fail-closed
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/yandex_analytics_reaper/point_observation.py')
          text = path.read_text(encoding='utf-8')

          replacements = [
              (
                  'from collections.abc import Mapping, Sequence\n',
                  'from collections.abc import Sequence\n',
                  'unused Mapping import',
              ),
              (
                  '        declaration = ListingObservationSetDeclaration.model_validate(declaration.model_dump())\n'
                  '        result = self.rich_collector.collect(declaration.app_ids)\n',
                  '        declaration = ListingObservationSetDeclaration.model_validate(declaration.model_dump())\n'
                  '        if artifact_path.exists():\n'
                  '            raise ListingObservationError(\n'
                  '                f"refusing to overwrite existing observation artifact: {artifact_path}"\n'
                  '            )\n'
                  '        result = self.rich_collector.collect(declaration.app_ids)\n',
                  'collector create-only entry block',
              ),
              (
                  '    if report.declaration_content_hash != declaration_hash:\n'
                  '        raise ListingObservationError("report declaration hash does not match declaration")\n'
                  '    if manifest.source_snapshot_id != metadata.id:\n',
                  '    if report.declaration_content_hash != declaration_hash:\n'
                  '        raise ListingObservationError("report declaration hash does not match declaration")\n'
                  '    declaration_identity = (\n'
                  '        declaration.observation_set_id,\n'
                  '        declaration.observation_set_version,\n'
                  '    )\n'
                  '    if (\n'
                  '        manifest.observation_set_id,\n'
                  '        manifest.observation_set_version,\n'
                  '    ) != declaration_identity:\n'
                  '        raise ListingObservationError(\n'
                  '            "manifest observation-set identity does not match declaration"\n'
                  '        )\n'
                  '    if (\n'
                  '        report.observation_set_id,\n'
                  '        report.observation_set_version,\n'
                  '    ) != declaration_identity:\n'
                  '        raise ListingObservationError(\n'
                  '            "report observation-set identity does not match declaration"\n'
                  '        )\n'
                  '    if manifest.source_snapshot_id != metadata.id:\n',
                  'verifier cohort identity block',
              ),
          ]

          for old, new, label in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly one match, found {count}')
              text = text.replace(old, new, 1)

          path.write_text(text, encoding='utf-8')
          PY
          python -m pip install "ruff>=0.12,<1"
          ruff format src/yandex_analytics_reaper/point_observation.py tests/test_point_observation_side_effects.py
          ruff check --fix src/yandex_analytics_reaper/point_observation.py tests/test_point_observation_side_effects.py
          git diff --check
      - name: Commit fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/yandex_analytics_reaper/point_observation.py tests/test_point_observation_side_effects.py
          git commit -m "Harden point observation identity and create-only gate"
          git push origin HEAD:feature/r0.4-p1-point-observation
