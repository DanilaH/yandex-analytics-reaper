name: Decorated Mail falsification pass

on:
  push:
    branches:
      - research/decorated-mail-falsification-2026-09-14

permissions:
  contents: read

jobs:
  sweep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            constraints-dev.txt
      - name: Install Reaper
        run: |
          python -m pip install "pip==26.2.1"
          pip install -c constraints-dev.txt -e .
      - name: Run bounded Decorated Mail thesis
        shell: bash
        run: |
          set -o pipefail
          yandex-reaper-thesis run research/decorated-mail-falsification-2026-09-14/suite.json --workers 2 | tee decorated-mail-result.json
      - name: Upload evidence
        uses: actions/upload-artifact@v4
        with:
          name: decorated-mail-falsification-2026-09-14
          path: |
            decorated-mail-result.json
            artifacts/
          if-no-files-found: error
          retention-days: 30
