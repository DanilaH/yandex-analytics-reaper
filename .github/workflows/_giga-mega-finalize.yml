name: Giga Mega Super Bank Finalize

on:
  push:
    branches:
      - research/giga-mega-super-bank-2026-09-14
    paths:
      - '.github/workflows/_giga-mega-finalize.yml'

permissions:
  actions: read
  contents: read

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Reaper
        run: pip install -e '.[dev]'
      - name: Download exact frozen baseline
        uses: actions/download-artifact@v5
        with:
          name: giga-mega-super-bank-2026-09-14
          run-id: 34856470819
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: frozen-wrapper
      - name: Locate and verify frozen inputs
        shell: bash
        run: |
          set -euo pipefail
          CURRENT=$(find frozen-wrapper -type f -path '*/artifacts/exports/giga-mega-super-bank-2026-09-14/*.zip' | head -n1)
          test -n "$CURRENT"
          echo "CURRENT=$CURRENT" >> "$GITHUB_ENV"
          sha256sum "$CURRENT"
          find frozen-wrapper -type f -name 'young-outliers.json' -print
      - name: Build reviewed intelligence offline
        shell: bash
        run: |
          set -euo pipefail
          args=()
          for f in research/giga-mega-super-bank-2026-09-14/reviews/*.json; do
            args+=(--review "$f")
          done
          yandex-reaper-thesis build \
            research/giga-mega-super-bank-2026-09-14/suite.json \
            "$CURRENT" \
            "${args[@]}" | tee reviewed-build.json
          REVIEWED=$(python - <<'PY'
          import json
          print(json.load(open('reviewed-build.json'))['artifact_path'])
          PY
          )
          echo "REVIEWED=$REVIEWED" >> "$GITHUB_ENV"
      - name: Verify reviewed intelligence from frozen source
        shell: bash
        run: |
          set -euo pipefail
          yandex-reaper-thesis verify "$REVIEWED" --current "$CURRENT" | tee reviewed-verify.json
          python - <<'PY'
          import json
          assert json.load(open('reviewed-verify.json'))['status'] == 'PASS'
          PY
      - name: Stage final reviewed evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p final/reviews final/source
          cp "$REVIEWED" final/reviewed-intelligence.zip
          cp "$CURRENT" final/source/frozen-experiment.zip
          cp research/giga-mega-super-bank-2026-09-14/suite.json final/suite.json
          cp research/giga-mega-super-bank-2026-09-14/reviews/*.json final/reviews/
          cp reviewed-build.json reviewed-verify.json final/
          YOUNG=$(find frozen-wrapper -type f -name 'young-outliers.json' | head -n1 || true)
          if [ -n "$YOUNG" ]; then cp "$YOUNG" final/young-outliers.json; fi
          sha256sum final/reviewed-intelligence.zip final/source/frozen-experiment.zip | tee final/SHA256SUMS
          unzip -p final/reviewed-intelligence.zip comparison/thesis-comparison.json > final/thesis-comparison.json
          unzip -p final/reviewed-intelligence.zip comparison/thesis-comparison.md > final/thesis-comparison.md
      - uses: actions/upload-artifact@v4
        with:
          name: giga-mega-super-bank-final-2026-09-14
          path: final
          if-no-files-found: error
