name: PR C cleanup check

on:
  push:
    branches:
      - feat/analyst-runner-v1.2-workers

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/analyst-runner-v1.2-workers
      - name: Assert temporary files are absent except this check
        shell: bash
        run: |
          test ! -e scripts/pr_c_bootstrap.py
          test ! -e scripts/pr_c_bootstrap_fix.py
          test ! -e .github/workflows/pr-c-bootstrap.yml
          test ! -e .github/workflows/pr-c-runner-concurrency-acceptance.yml
          test ! -e .github/workflows/pr-c-final-gate.yml
      - name: Remove cleanup check
        shell: bash
        run: |
          rm -f .github/workflows/pr-c-noop-cleanup-check.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "ci: confirm clean PR C tree"
          git push origin HEAD:feat/analyst-runner-v1.2-workers
