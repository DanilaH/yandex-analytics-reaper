name: Hyper Sweep source-bound final review (temporary)
on:
  push:
    branches:
      - research/hyper-sweep-2026-09-16
    paths:
      - .github/workflows/hyper-sweep-final-review.yml

permissions:
  contents: read
  actions: read

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - name: Download both exact frozen source workflows
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/hyper-prior /tmp/hyper-new
          gh run download 35079773828 -n super-mega-giga-hyper-2026-09-16 -D /tmp/hyper-prior
          gh run download 35085615493 -n hyper-sweep-2026-09-16-raw-and-intelligence -D /tmp/hyper-new
          find /tmp/hyper-prior /tmp/hyper-new -type f -printf '%p %s bytes\n' | sort
      - name: Build and verify both reviewed intelligence artifacts strictly offline
        run: |
          set -euo pipefail
          prior_raw="/tmp/hyper-prior/artifacts/exports/super-mega-giga-hyper-2026-09-16/20260916T093032Z.zip"
          new_raw="/tmp/hyper-new/artifacts/exports/hyper-sweep-product-systems-2026-09-16/20260916T103334Z.zip"
          prior_intel="$(find /tmp/hyper-prior/artifacts/intelligence -type f -name '*.zip' | head -n1)"
          new_intel="$(find /tmp/hyper-new/artifacts/intelligence -type f -name '*.zip' | head -n1)"
          test -f "$prior_raw" && test -f "$new_raw" && test -f "$prior_intel" && test -f "$new_intel"
          printf '%s  %s\n' '19400a97d95cd14114dce34fbc5855399579c962d842059ce64fcc4c1f16a286' "$prior_raw" '4330087e5efab003768d9560b903ff2fe28ef50ed75924d5ffcade75e3f16fe5' "$new_raw" | sha256sum -c -
          cp /tmp/hyper-prior/suite.json research/hyper-sweep-2026-09-16/prior-suite-frozen.json
          mkdir -p research/hyper-sweep-2026-09-16/reviews/prior research/hyper-sweep-2026-09-16/reviews/new
          python research/hyper-sweep-2026-09-16/build_reviews.py prior research/hyper-sweep-2026-09-16/prior-suite-frozen.json "$prior_intel" research/hyper-sweep-2026-09-16/reviews/prior
          python research/hyper-sweep-2026-09-16/build_reviews.py new research/hyper-sweep-2026-09-16/suite.json "$new_intel" research/hyper-sweep-2026-09-16/reviews/new
          prior_args=(); for f in research/hyper-sweep-2026-09-16/reviews/prior/*.json; do prior_args+=(--review "$f"); done
          new_args=(); for f in research/hyper-sweep-2026-09-16/reviews/new/*.json; do new_args+=(--review "$f"); done
          mkdir -p /tmp/hyper-reviewed
          yandex-reaper-thesis build research/hyper-sweep-2026-09-16/prior-suite-frozen.json "$prior_raw" "${prior_args[@]}" > /tmp/hyper-reviewed/prior-build.json
          yandex-reaper-thesis build research/hyper-sweep-2026-09-16/suite.json "$new_raw" "${new_args[@]}" > /tmp/hyper-reviewed/new-build.json
          prior_reviewed="$(find artifacts/intelligence/super-mega-giga-hyper-2026-09-16 -type f -name '*.zip' | head -n1)"
          new_reviewed="$(find artifacts/intelligence/hyper-sweep-product-systems-2026-09-16 -type f -name '*.zip' | head -n1)"
          test -f "$prior_reviewed" && test -f "$new_reviewed"
          yandex-reaper-thesis verify "$prior_reviewed" --current "$prior_raw" > /tmp/hyper-reviewed/prior-verify.json
          yandex-reaper-thesis verify "$new_reviewed" --current "$new_raw" > /tmp/hyper-reviewed/new-verify.json
          cp "$prior_reviewed" /tmp/hyper-reviewed/prior-reviewed-intelligence.zip
          cp "$new_reviewed" /tmp/hyper-reviewed/new-reviewed-intelligence.zip
          cp -R research/hyper-sweep-2026-09-16/reviews /tmp/hyper-reviewed/
          cp research/hyper-sweep-2026-09-16/prior-suite-frozen.json /tmp/hyper-reviewed/
          sha256sum /tmp/hyper-reviewed/*zip | tee /tmp/hyper-reviewed/checksums.sha256
          cat /tmp/hyper-reviewed/prior-verify.json /tmp/hyper-reviewed/new-verify.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hyper-sweep-2026-09-16-reviewed-final
          path: /tmp/hyper-reviewed/
          if-no-files-found: error
          retention-days: 30
