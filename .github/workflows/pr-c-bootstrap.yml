name: PR C bootstrap

on:
  push:
    branches:
      - feat/analyst-runner-v1.2-workers

permissions:
  contents: write

jobs:
  implement-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/analyst-runner-v1.2-workers
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            constraints-dev.txt
      - name: Generate PR C product tree
        shell: bash
        run: |
          python scripts/pr_c_bootstrap_fix.py
          python scripts/pr_c_bootstrap.py
          python - <<'PY'
          from pathlib import Path

          workflow = Path("src/yandex_analytics_reaper/analyst_workflow.py")
          text = workflow.read_text(encoding="utf-8")
          dead = (
              "        session_manager = YandexSessionManager(\n"
              "            state_root=workdir / \"sessions\",\n"
              "            base_url=self.settings.yandex_base_url,\n"
              "            timeout_seconds=self.settings.http_timeout_seconds,\n"
              "            user_agent=self.settings.user_agent,\n"
              "        )\n\n"
          )
          if text.count(dead) != 1:
              raise RuntimeError("expected one pre-worker shared session manager")
          workflow.write_text(text.replace(dead, "", 1), encoding="utf-8")

          e2e = Path("tests/test_analyst_workflow_end_to_end.py")
          test_text = e2e.read_text(encoding="utf-8")
          old_signature = (
              "            schema_registry: SQLiteSchemaDriftRegistry,\n"
              "            session_manager: object,\n"
              "            family_id: str,\n"
              "            query_index: int,\n"
              "            query_total: int,\n"
              "            events: object,\n"
          )
          new_signature = (
              "            schema_registry: SQLiteSchemaDriftRegistry,\n"
              "            session_manager: object,\n"
              "            persistence_gate: object,\n"
              "            family_id: str,\n"
              "            query_index: int,\n"
              "            query_total: int,\n"
              "            worker: str,\n"
              "            events: object,\n"
          )
          if test_text.count(old_signature) != 1:
              raise RuntimeError("expected one end-to-end collect_search fixture signature")
          test_text = test_text.replace(old_signature, new_signature, 1)
          old_del = "            del session_manager, family_id, query_index, query_total, events, timings\n"
          new_del = (
              "            del session_manager, persistence_gate, family_id, query_index, "
              "query_total, worker, events, timings\n"
          )
          if test_text.count(old_del) != 1:
              raise RuntimeError("expected one end-to-end collect_search fixture del statement")
          e2e.write_text(test_text.replace(old_del, new_del, 1), encoding="utf-8")
          PY
          python -m compileall -q src tests
          rm -f scripts/pr_c_bootstrap.py scripts/pr_c_bootstrap_fix.py
      - name: Install exact dev environment
        run: |
          python -m pip install "pip==26.2.1"
          pip install -c constraints-dev.txt -e ".[dev]"
      - name: Format generated files
        run: |
          ruff format \
            src/yandex_analytics_reaper/analyst_workflow.py \
            src/yandex_analytics_reaper/experiment_cli.py \
            src/yandex_analytics_reaper/experiment_runtime.py \
            src/yandex_analytics_reaper/experiment_workers.py \
            src/yandex_analytics_reaper/ingestion/yandex_probes.py \
            src/yandex_analytics_reaper/ingestion/__init__.py \
            tests/test_analyst_workflow.py \
            tests/test_analyst_workflow_end_to_end.py \
            tests/test_experiment_cli_workers.py \
            tests/test_experiment_workers.py \
            tests/test_probe_persistence_gate.py
          ruff check --fix \
            src/yandex_analytics_reaper/analyst_workflow.py \
            src/yandex_analytics_reaper/experiment_cli.py \
            src/yandex_analytics_reaper/experiment_runtime.py \
            src/yandex_analytics_reaper/experiment_workers.py \
            src/yandex_analytics_reaper/ingestion/yandex_probes.py \
            src/yandex_analytics_reaper/ingestion/__init__.py \
            tests/test_analyst_workflow.py \
            tests/test_analyst_workflow_end_to_end.py \
            tests/test_experiment_cli_workers.py \
            tests/test_experiment_workers.py \
            tests/test_probe_persistence_gate.py
      - name: Ruff
        run: ruff check .
      - name: Mypy
        run: mypy src
      - name: Pytest and coverage
        run: pytest --cov=yandex_analytics_reaper --cov-report=term-missing --cov-fail-under=80
      - name: Commit verified PR C implementation
        shell: bash
        run: |
          rm -f .github/workflows/pr-c-bootstrap.yml scripts/pr_c_bootstrap.py scripts/pr_c_bootstrap_fix.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "feat: add bounded analyst query workers"
          git push origin HEAD:feat/analyst-runner-v1.2-workers
