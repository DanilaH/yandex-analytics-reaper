name: Microgame Trend Sweep V2 2026-09-01

on:
  push:
    branches:
      - research/microgame-trend-sweep-v2-2026-09-01
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Reaper
        run: |
          python -m pip install -e .
          python -m pip install pytest

      - name: Verify remote protocol retry handling
        run: python -m pytest tests/test_yandex_client_transport_retry.py -q

      - name: Restore failed sweep workdir
        uses: actions/download-artifact@v4
        with:
          name: microgame-trend-sweep-v2-2026-09-01
          run-id: 33509590899
          github-token: ${{ github.token }}
          path: .

      - name: Resume microgame trend sweep v2
        run: |
          set -o pipefail
          yandex-reaper-experiment resume artifacts/work/microgame-trend-sweep-v2-2026-09-01/20260901T124723Z --workers 4 | tee sweep-result.json

      - name: Upload sweep evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: microgame-trend-sweep-v2-2026-09-01
          retention-days: 30
          if-no-files-found: warn
          path: |
            sweep-result.json
            research/microgame-trend-sweep-v2-2026-09-01/manifest.json
            artifacts/**
