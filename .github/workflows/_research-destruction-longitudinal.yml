name: Destruction longitudinal observation

on:
  push:
    branches:
      - research/satisfying-destruction-longitudinal-2026-09-13

permissions:
  contents: read
  actions: read

jobs:
  observe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            constraints-dev.txt
      - name: Install Reaper
        run: |
          python -m pip install "pip==26.2.1"
          pip install -c constraints-dev.txt -e .
      - name: Download 2026-09-02 frozen prior
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p prior
          gh run download 33652672808 \
            --repo DanilaH/yandex-analytics-reaper \
            --name satisfying-destruction-p7-2026-09-02 \
            --dir prior
          python - <<'PY'
          from hashlib import sha256
          from pathlib import Path

          expected = "a27a3bdedcf5f917aaffd4675683caa04f45b72e9dc752e5fd6a036227b7f444"
          matches = []
          for path in Path("prior").rglob("*.zip"):
              if sha256(path.read_bytes()).hexdigest() == expected:
                  matches.append(path)
          if len(matches) != 1:
              raise SystemExit(f"expected exactly one prior experiment ZIP, found {matches}")
          Path("prior-experiment-path.txt").write_text(str(matches[0]))
          print(matches[0])
          PY
      - name: Run exact refined thesis with frozen prior
        run: |
          set -o pipefail
          PRIOR_ZIP="$(cat prior-experiment-path.txt)"
          yandex-reaper-thesis run \
            research/satisfying-destruction-p7-2026-09-02/suite-v2.json \
            --prior "$PRIOR_ZIP" \
            --workers 2 | tee longitudinal-result.json
      - name: Upload observation artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: satisfying-destruction-longitudinal-2026-09-13-${{ github.run_attempt }}
          path: |
            longitudinal-result.json
            artifacts/
          if-no-files-found: warn
          retention-days: 30
