name: Reaper 0.2.0 repository closeout

on:
  push:
    branches:
      - docs/reaper-0.2.0-closeout
    paths:
      - .github/workflows/reaper-0.2.0-closeout.yml

permissions:
  actions: read
  contents: write

jobs:
  closeout:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: docs/reaper-0.2.0-closeout

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Download verified acceptance artifact
        uses: actions/download-artifact@v5
        with:
          name: reaper-0.2.0-mystery-sweep
          path: .closeout-artifact
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: 33477467946

      - name: Persist compact research evidence and close roadmap
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import csv
          import json
          import re
          import shutil
          from collections import Counter, defaultdict
          from datetime import datetime
          from pathlib import Path
          from zipfile import ZipFile

          artifact_root = Path('.closeout-artifact')
          inner_zip = artifact_root / '20260901T062453Z.zip'
          extracted = Path('.closeout-final')
          if extracted.exists():
              shutil.rmtree(extracted)
          extracted.mkdir()
          with ZipFile(inner_zip) as archive:
              archive.extractall(extracted)

          research = Path('research/mystery-unboxing-collection-sweep-v1')
          research.mkdir(parents=True, exist_ok=True)
          history = Path('docs/history')
          history.mkdir(parents=True, exist_ok=True)

          summary = json.loads((extracted / 'execution-summary.json').read_text(encoding='utf-8'))
          manifest = json.loads((extracted / 'input/manifest.json').read_text(encoding='utf-8'))
          features = json.loads((extracted / 'reports/market-features.json').read_text(encoding='utf-8'))
          market = json.loads((extracted / 'reports/market-export.json').read_text(encoding='utf-8'))
          coherence = json.loads((extracted / 'reports/family-coherence.json').read_text(encoding='utf-8'))

          for source, destination in (
              (extracted / 'csv/listings.csv', research / 'listings.csv'),
              (extracted / 'csv/comparable_memberships.csv', research / 'comparable_memberships.csv'),
              (extracted / 'csv/search_supply.csv', research / 'search_supply.csv'),
              (extracted / 'reports/family-coherence.json', research / 'family-coherence.json'),
          ):
              shutil.copy2(source, destination)

          (research / 'manifest.json').write_text(
              json.dumps(manifest, ensure_ascii=False, indent=2) + '\n',
              encoding='utf-8',
          )
          run_summary = {
              'release': '0.2.0',
              'workflow_version': summary['workflow_version'],
              'experiment_id': summary['experiment_id'],
              'run_id': summary['run_id'],
              'status': summary['status'],
              'verifier_status': summary['verifier_status'],
              'family_count': summary['family_count'],
              'query_count': summary['query_count'],
              'unique_listings': summary['comparable_unique_listing_count'],
              'rich_requested': summary['rich_requested_listing_count'],
              'rich_observed': summary['rich_observed_listing_count'],
              'final_invocation_mode': summary['final_invocation_mode'],
              'final_invocation_workers': summary['final_invocation_workers'],
              'was_resumed': summary['was_resumed'],
              'reused_query_count': summary['reused_query_count'],
              'collected_query_count': summary['collected_query_count'],
              'artifact_sha256': 'ea82be46229b63ac7a4966692c4d01ad6e24e1e58e7c13a9b5176f2a80d9342b',
              'artifact_manifest_sha256': '91f9a4b74e5cde45f21f9ed08cc0bff0ef0e8b65a9f0717de020cae88d971c07',
              'actions_run_id': 33477467946,
              'actions_artifact_id': 9788694982,
              'actions_artifact_retention_days': 14,
          }
          (research / 'run-summary.json').write_text(
              json.dumps(run_summary, ensure_ascii=False, indent=2) + '\n',
              encoding='utf-8',
          )

          coherence_by_family = {item['family_id']: item for item in coherence}
          family_rows = []
          for item in features['comparable_sets']:
              windows = {
                  row['max_age_days']: row['listing_count']
                  for row in item['first_published']['windows']
              }
              supply_values = []
              for supply in item['query_supply']:
                  values = supply['distinct_observed_values']
                  supply_values.append(values[0] if len(values) == 1 else None)
              observed_supply = [value for value in supply_values if value is not None]
              developers = item['developer_composition']
              rating_count = item['rating_count']
              family_coherence = coherence_by_family[item['query_family_id']]
              family_rows.append({
                  'family_id': item['query_family_id'],
                  'member_count': item['member_count'],
                  'query_count': len(item['query_supply']),
                  'supply_min': min(observed_supply) if observed_supply else '',
                  'supply_max': max(observed_supply) if observed_supply else '',
                  'rating_count_median': rating_count['median'],
                  'rating_count_p75': rating_count['p75'],
                  'rating_count_max': rating_count['maximum'],
                  'fresh_30d': windows.get(30, 0),
                  'fresh_90d': windows.get(90, 0),
                  'fresh_180d': windows.get(180, 0),
                  'developer_count': developers['distinct_developer_count'],
                  'largest_developer_share': developers['largest_developer_share'],
                  'all_query_jaccard': family_coherence['all_query_jaccard'],
              })
          with (research / 'family-summary.csv').open('w', newline='', encoding='utf-8') as handle:
              writer = csv.DictWriter(handle, fieldnames=list(family_rows[0]))
              writer.writeheader()
              writer.writerows(family_rows)

          with (extracted / 'csv/listings.csv').open(encoding='utf-8') as handle:
              listings = {
                  row['platform_listing_id']: row
                  for row in csv.DictReader(handle)
              }
          query_hits: dict[str, set[str]] = defaultdict(set)
          family_hits: dict[str, set[str]] = defaultdict(set)
          ranks: dict[str, list[int]] = defaultdict(list)
          page1_hits: Counter[str] = Counter()
          for exposure in market['search_exposures']:
              listing_id = exposure['platform_listing_id']
              query_hits[listing_id].add(exposure['query_text'])
              family_hits[listing_id].add(exposure['set_id'].rsplit('--', 1)[-1])
              match = re.search(r'items\[(\d+)\]', exposure['source_object_path'])
              item_index = int(match.group(1)) if match else 0
              rank = exposure['page_index'] * 12 + item_index + 1
              ranks[listing_id].append(rank)
              if exposure['page_index'] == 0:
                  page1_hits[listing_id] += 1

          reference_time = datetime.fromisoformat(features['reference_time'].replace('Z', '+00:00'))
          candidates = []
          for listing_id, listing in listings.items():
              published = listing['first_published_at']
              age_days = None
              if published:
                  published_at = datetime.fromisoformat(published.replace('Z', '+00:00'))
                  age_days = (reference_time - published_at).total_seconds() / 86400
              rating_count = int(listing['rating_count'] or 0)
              query_count = len(query_hits[listing_id])
              family_count = len(family_hits[listing_id])
              best_rank = min(ranks[listing_id]) if ranks[listing_id] else None
              freshness = max(0.0, 1.0 - (age_days if age_days is not None else 999.0) / 365.0)
              traction = min(1.0, (rating_count / 5000) ** 0.5) if rating_count else 0.0
              breadth = min(1.0, query_count / 6)
              rank_score = 1 / (best_rank ** 0.5) if best_rank else 0.0
              research_priority = round(
                  100 * (0.30 * freshness + 0.30 * traction + 0.25 * breadth + 0.15 * rank_score),
                  2,
              )
              candidates.append({
                  'listing_id': listing_id,
                  'canonical_url': listing['canonical_url'],
                  'title': listing['title'],
                  'developer_name': listing['developer_name'],
                  'age_days': round(age_days, 1) if age_days is not None else '',
                  'rating_count': rating_count,
                  'player_rating': listing['player_rating'],
                  'query_hits': query_count,
                  'family_hits': family_count,
                  'best_rank': best_rank or '',
                  'page1_hits': page1_hits[listing_id],
                  'families': ' | '.join(sorted(family_hits[listing_id])),
                  'queries': ' | '.join(sorted(query_hits[listing_id])),
                  'research_priority': research_priority,
              })
          candidates.sort(
              key=lambda row: (row['research_priority'], row['rating_count']),
              reverse=True,
          )
          candidate_universe = [
              row for row in candidates
              if (row['age_days'] != '' and row['age_days'] <= 365) or row['query_hits'] >= 5
          ][:120]
          with (research / 'candidate-universe.csv').open('w', newline='', encoding='utf-8') as handle:
              writer = csv.DictWriter(handle, fieldnames=list(candidate_universe[0]))
              writer.writeheader()
              writer.writerows(candidate_universe)

          (research / 'README.md').write_text(
              f'''# Mystery / Unboxing / Collection sweep v1

Permanent compact record of the real Reaper `0.2.0` acceptance/opportunity sweep executed on 2026-09-01.

## Identity

- experiment: `{summary['experiment_id']}`
- run: `{summary['run_id']}`
- workflow: `{summary['workflow_version']}`
- context: clean anonymous, RU, desktop / desktop_other, 3 pages
- families: {summary['family_count']}
- exact queries: {summary['query_count']}
- unique comparable listings: {summary['comparable_unique_listing_count']}
- rich metadata: {summary['rich_observed_listing_count']} / {summary['rich_requested_listing_count']}
- final invocation: `{summary['final_invocation_mode']}`, workers={summary['final_invocation_workers']}
- verifier: `{summary['verifier_status']}`

## Recovery acceptance

The first invocation was deliberately killed with `SIGKILL` after completed exact-query evidence existed. The same workdir was resumed with four workers. The final execution reused {summary['reused_query_count']} valid completed queries and collected {summary['collected_query_count']} queries, totaling {summary['query_count']}. Stale interrupted probe runs were not reused.

## Committed files

- `manifest.json` — exact sweep input.
- `run-summary.json` — run/release/Actions identity and artifact hashes.
- `listings.csv` — 665 enriched unique listings.
- `comparable_memberships.csv` — family membership and exact-query provenance.
- `search_supply.csv` — query-level Yandex `totalGamesCount` observations.
- `family-coherence.json` — query-family overlap diagnostics.
- `family-summary.csv` — compact family comparison for manual research.
- `candidate-universe.csv` — transparent research-priority shortlist for gameplay inspection; **not** a BUILD/WATCH/SKIP model.

The full raw snapshots, SQLite database, execution logs and verified immutable ZIP are intentionally not committed to Git. They were uploaded as GitHub Actions artifact `9788694982` from run `33477467946` with 14-day retention.

## Evidence caution

`ratingCount`, search rank/exposure and current supply are traction/supply proxies, not DAU, revenue, retention or profitability. Query-family labels are analyst hypotheses; `family-coherence.json` must be consulted before treating a family as one market.
''',
              encoding='utf-8',
          )

          (history / 'reaper-0.2.0-acceptance-2026-09-01.md').write_text(
              '''# Reaper 0.2.0 release acceptance — 2026-09-01

## Result

Reaper `0.2.0` / Analyst Experiment Runner v1.2 passed its real release acceptance. M1.5 is complete.

- merged release implementation: `ce2173bacaf63a34ba599a15d820e6f0a1ccbe72`
- final pre-merge quality gate: 356 tests passed, 84.28% total coverage, `ruff` PASS, strict `mypy` PASS
- real sweep: 15 families, 36 exact queries, 3 pages, 4 workers
- deliberate `SIGKILL` after completed query evidence existed
- same-workdir deterministic resume: PASS
- valid COMPLETED-query reuse: PASS
- stale interrupted RUNNING probe rejection: PASS
- final query total: 36 / 36
- unique comparable listings: 665
- rich metadata: 665 / 665
- final packaged verifier: PASS
- final resume invocation elapsed: ~35.33 s
- final immutable artifact SHA-256: `ea82be46229b63ac7a4966692c4d01ad6e24e1e58e7c13a9b5176f2a80d9342b`

The acceptance also served as the required M1.6 Mystery / Unboxing / Collection collection run. Compact permanent research inputs are stored under [`research/mystery-unboxing-collection-sweep-v1/`](../../research/mystery-unboxing-collection-sweep-v1/).

## Interpretation

This closes the runner engineering milestone. New runner/platform infrastructure is not the next task. The next mandatory work is manual opportunity decomposition of the 665-listing sweep into 1–3 ultra-low-production-burden candidate theses, followed by M2 only for a real candidate.
''',
              encoding='utf-8',
          )

          roadmap_path = Path('ROADMAP.md')
          roadmap = roadmap_path.read_text(encoding='utf-8')
          old_block = '''`START ANALYSIS` has already been reached. The current blocker is narrower: the analyst experiment
runner can execute real sweeps, but long sweeps are still operationally fragile because execution
is silent, foreground-shell interruption destroys useful progress, and exact queries are collected
sequentially.
'''
          new_block = '''`START ANALYSIS` has already been reached. Reaper `0.2.0` / Analyst Experiment Runner v1.2 is
complete and has passed real hard-kill → same-workdir resume acceptance. The current blocker is no
longer runner infrastructure: the required Mystery / Unboxing / Collection sweep has been collected
and must now be decomposed into concrete low-production-burden opportunities.
'''
          if old_block not in roadmap:
              raise SystemExit('delivery-strategy blocker text changed unexpectedly')
          roadmap = roadmap.replace(old_block, new_block, 1)
          roadmap = roadmap.replace(
              '## M1.5 — Reaper `0.2.0` / Analyst Experiment Runner v1.2 — IN PROGRESS',
              '## M1.5 — Reaper `0.2.0` / Analyst Experiment Runner v1.2 — COMPLETE 2026-09-01',
              1,
          )
          roadmap = roadmap.replace(
              '**Current highest-priority implementation milestone.**',
              '**Completed and accepted on real Yandex evidence on 2026-09-01.**',
              1,
          )
          start = roadmap.index('## M1.5 —')
          end = roadmap.index('## M1.6 —')
          m15 = roadmap[start:end].replace('- [ ]', '- [x]')
          evidence_note = '''
Evidence record:
[`docs/history/reaper-0.2.0-acceptance-2026-09-01.md`](docs/history/reaper-0.2.0-acceptance-2026-09-01.md).

'''
          marker = 'Explicitly out of scope:\n'
          if evidence_note not in m15:
              m15 = m15.replace(marker, evidence_note + marker, 1)
          roadmap = roadmap[:start] + m15 + roadmap[end:]
          roadmap = roadmap.replace(
              '## M1.6 — Immediate post-`0.2.0` real opportunity sweep — REQUIRED BEFORE NEW INFRASTRUCTURE',
              '## M1.6 — Immediate post-`0.2.0` real opportunity sweep — IN PROGRESS (COLLECTION COMPLETE)',
              1,
          )
          m16_start = roadmap.index('## M1.6 —')
          m16_end = roadmap.index('## M2 —')
          m16 = roadmap[m16_start:m16_end]
          m16 = m16.replace(
              '- [ ] run/resume the full sweep through the verified v1.2 runner',
              '- [x] run/resume the full sweep through the verified v1.2 runner',
              1,
          )
          collection_note = '''
Collection evidence: [`research/mystery-unboxing-collection-sweep-v1/`](research/mystery-unboxing-collection-sweep-v1/) — 15 families, 36 exact queries, 665 unique listings, 665/665 rich metadata, verifier PASS.

'''
          if collection_note not in m16:
              m16 = m16.replace('Required analyst sequence:\n\n', collection_note + 'Required analyst sequence:\n\n', 1)
          roadmap = roadmap[:m16_start] + m16 + roadmap[m16_end:]
          guard_start = roadmap.index('# Current sequencing guard')
          roadmap = roadmap[:guard_start] + '''# Current sequencing guard

M1.5 / Reaper `0.2.0` is complete. The M1.6 collection run is also complete; opportunity analysis
is now the mandatory primary path.

Until M1.6 produces 1–3 concrete theses and at least one M2-worthy candidate, reject work that
substitutes new infrastructure for analysis, including:

```text
another runner redesign
scheduler
dashboard
generic orchestration framework
taxonomy expansion
ML/ranking
broad external-source integration
```

Before `FIRST DECISION LOOP`, work should materially improve:

```text
real candidate evidence
production burden understanding
reward-loop / re-themeability understanding
evidence coverage
dossier usability
explicit heuristic decision-making
```

The project optimizes for finding and testing **simple asymmetric opportunities**, not for
maximizing architectural sophistication.
'''
          roadmap_path.write_text(roadmap, encoding='utf-8')

          shutil.rmtree(artifact_root)
          shutil.rmtree(extracted)
          PY

      - name: Commit verified closeout
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/reaper-0.2.0-closeout.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'docs: close Reaper 0.2.0 and persist mystery sweep'
          git push origin HEAD:docs/reaper-0.2.0-closeout

      - name: Publish v0.2.0 release if absent
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if ! gh release view v0.2.0 >/dev/null 2>&1; then
            gh release create v0.2.0 \
              --target ce2173bacaf63a34ba599a15d820e6f0a1ccbe72 \
              --title 'Reaper 0.2.0' \
              --notes 'Analyst Experiment Runner v1.2: durable observability, deterministic same-workdir resume, bounded 1..4 exact-query workers, serialized SQLite persistence, crash-safe verified artifact publication. Real 15-family / 36-query Mystery sweep passed SIGKILL → resume acceptance with verifier PASS.'
          fi
