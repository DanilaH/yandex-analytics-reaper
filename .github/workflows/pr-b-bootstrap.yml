name: PR B bootstrap

on:
  push:
    branches:
      - feat/analyst-runner-v1.2-resume

permissions:
  contents: write

jobs:
  implement-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/analyst-runner-v1.2-resume
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            constraints-dev.txt
      - name: Generate PR B tree
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          bootstrap = Path("scripts/pr_b_bootstrap.py")
          text = bootstrap.read_text(encoding="utf-8")

          text, count = re.subn(
              r'\n    # Narrow probe lookup \+ validator coverage extends existing fixtures without source I/O\..*?    test_path\.write_text\(text, encoding="utf-8"\)\n',
              '\n',
              text,
              count=1,
              flags=re.DOTALL,
          )
          if count != 1:
              raise RuntimeError("could not remove stale invented comparable fixture block")

          text, count = re.subn(
              r'\n    replace_once\(\n        path,\n        "    parts\.append\(f\\"workdir=\{workdir\}\\"\)\\n    return \\"; \\"\.join\(parts\)\\n",.*?\n    \)\n',
              '\n',
              text,
              count=1,
              flags=re.DOTALL,
          )
          if count != 1:
              raise RuntimeError("could not remove stale formatter-body patch")

          old_timing = "replace_once(path, '                invocation_mode=\"run\",\\n', '                invocation_mode=invocation_mode,\\n')"
          new_timing = "replace_once(path, '            invocation_mode=\"run\",\\n', '            invocation_mode=invocation_mode,\\n')"
          if text.count(old_timing) != 1:
              raise RuntimeError("expected one stale timing-report indentation patch")
          text = text.replace(old_timing, new_timing, 1)

          lines = text.splitlines()
          in_helpers = False
          pattern_fixed = False
          replacement_fixed = False
          for index, line in enumerate(lines):
              if line.startswith("def patch_workflow_helpers"):
                  in_helpers = True
              if not in_helpers:
                  continue
              if 'r"def finalize_verified_artifact\\(' in line and "def package_workdir" in line:
                  lines[index] = '        r"def finalize_verified_artifact\\(.*?\\n\\n@contextmanager\\ndef _stage\\(",'
                  pattern_fixed = True
                  continue
              if pattern_fixed and "\\n\\ndef package_workdir(" in line:
                  lines[index] = line.replace(
                      "\\n\\ndef package_workdir(",
                      "\\n\\n@contextmanager\\ndef _stage(",
                      1,
                  )
                  replacement_fixed = True
                  break
          if not pattern_fixed or not replacement_fixed:
              raise RuntimeError("could not adapt standalone-finalizer patch boundary")
          bootstrap.write_text("\n".join(lines) + "\n", encoding="utf-8")
          PY

          python scripts/pr_b_bootstrap.py

          python - <<'PY'
          from pathlib import Path
          import re

          runtime = Path("src/yandex_analytics_reaper/experiment_runtime.py")
          runtime_text = runtime.read_text(encoding="utf-8")
          old = '        ("workdir_preserved", workdir),\n    )\n'
          new = '        ("workdir_preserved", workdir),\n        ("resume", resume_command),\n    )\n'
          if runtime_text.count(old) != 1:
              raise RuntimeError("expected one line-oriented failure formatter tuple")
          runtime.write_text(runtime_text.replace(old, new, 1), encoding="utf-8")

          workflow = Path("src/yandex_analytics_reaper/analyst_workflow.py")
          text = workflow.read_text(encoding="utf-8")

          text, count = re.subn(
              r'\n\s*listing_count=_organic_listing_count\(reusable, raw_store\),',
              '',
              text,
              count=1,
          )
          if count != 1:
              raise RuntimeError("expected reused-query pseudo listing count")
          text, count = re.subn(
              r'\n\ndef _organic_listing_count\(record: object, raw_store: FilesystemRawSnapshotStore\) -> int:.*?\n\ndef _result_from_existing_artifact',
              '\n\ndef _result_from_existing_artifact',
              text,
              count=1,
              flags=re.DOTALL,
          )
          if count != 1:
              raise RuntimeError("expected pseudo listing-count helper")

          text = text.replace(
              '        except (ExperimentRecoveryError, OSError, ValueError) as exc:\n',
              '        except Exception as exc:\n',
              1,
          )
          text = text.replace('    ExperimentRecoveryError,\n', '', 1)
          text = text.replace(
              '    except (BadZipFile, KeyError, OSError, ValueError) as exc:\n',
              '    except (AnalystExperimentError, BadZipFile, KeyError, OSError, ValueError) as exc:\n',
              1,
          )
          if text.count('repository_root = _repository_root()') != 1:
              raise RuntimeError("expected generated stale repository-root helper call")
          text = text.replace(
              'repository_root = _repository_root()',
              'repository_root = find_repository_root(workdir)',
              1,
          )
          workflow.write_text(text, encoding="utf-8")
          PY

          python -m compileall -q src
          rm -f scripts/pr_b_bootstrap.py
      - name: Install exact dev environment
        run: |
          python -m pip install "pip==26.2.1"
          pip install -c constraints-dev.txt -e ".[dev]"
      - name: Format generated files
        run: |
          ruff format \
            src/yandex_analytics_reaper/storage/probes.py \
            src/yandex_analytics_reaper/comparables/yandex_search.py \
            src/yandex_analytics_reaper/experiment_runtime.py \
            src/yandex_analytics_reaper/experiment_recovery.py \
            src/yandex_analytics_reaper/analyst_workflow.py \
            src/yandex_analytics_reaper/experiment_cli.py \
            tests/test_experiment_recovery.py
      - name: Ruff
        run: ruff check .
      - name: Mypy
        run: mypy src
      - name: Pytest and coverage
        run: pytest --cov=yandex_analytics_reaper --cov-report=term-missing --cov-fail-under=80
      - name: Commit verified PR B implementation
        shell: bash
        run: |
          rm -f .github/workflows/pr-b-bootstrap.yml scripts/pr_b_bootstrap.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "feat: add deterministic experiment resume"
          git push origin HEAD:feat/analyst-runner-v1.2-resume
