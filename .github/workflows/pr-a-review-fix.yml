name: PR A reviewed fix

on:
  push:
    branches:
      - feat/analyst-runner-v1.2-observability

permissions:
  contents: write

jobs:
  fix-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/analyst-runner-v1.2-observability
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            constraints-dev.txt
      - name: Apply reviewed fix and regression tests
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/yandex_analytics_reaper/analyst_workflow.py')
          text = path.read_text(encoding='utf-8')
          old = '''            except _TRANSPORT_ERRORS as exc:\n                if attempt >= _MAX_TRANSPORT_ATTEMPTS:\n                    raise\n                delay = float(attempt)\n                timings.record_retry(\n                    unit="rich_batch",\n                    attempt=attempt,\n                    delay_seconds=delay,\n                    batch_index=batch_index,\n                )\n                events.emit(\n                    "rich_batch_retry",\n                    stage="rich_metadata",\n                    batch_index=batch_index,\n                    batch_total=batch_total,\n                    attempt=attempt,\n                    max_attempts=_MAX_TRANSPORT_ATTEMPTS,\n                    error_type=type(exc).__name__,\n                    error_message=str(exc).strip() or type(exc).__name__,\n                    retry_delay_seconds=delay,\n                )\n                self.sleeper(delay)\n'''
          new = '''            except _TRANSPORT_ERRORS as exc:\n                if attempt >= _MAX_TRANSPORT_ATTEMPTS:\n                    events.emit(\n                        "rich_batch_failed",\n                        stage="rich_metadata",\n                        batch_index=batch_index,\n                        batch_total=batch_total,\n                        attempt=attempt,\n                        max_attempts=_MAX_TRANSPORT_ATTEMPTS,\n                        error_type=type(exc).__name__,\n                        error_message=str(exc).strip() or type(exc).__name__,\n                    )\n                    raise\n                delay = float(attempt)\n                timings.record_retry(\n                    unit="rich_batch",\n                    attempt=attempt,\n                    delay_seconds=delay,\n                    batch_index=batch_index,\n                )\n                events.emit(\n                    "rich_batch_retry",\n                    stage="rich_metadata",\n                    batch_index=batch_index,\n                    batch_total=batch_total,\n                    attempt=attempt,\n                    max_attempts=_MAX_TRANSPORT_ATTEMPTS,\n                    error_type=type(exc).__name__,\n                    error_message=str(exc).strip() or type(exc).__name__,\n                    retry_delay_seconds=delay,\n                )\n                self.sleeper(delay)\n            except Exception as exc:\n                events.emit(\n                    "rich_batch_failed",\n                    stage="rich_metadata",\n                    batch_index=batch_index,\n                    batch_total=batch_total,\n                    attempt=attempt,\n                    max_attempts=_MAX_TRANSPORT_ATTEMPTS,\n                    error_type=type(exc).__name__,\n                    error_message=str(exc).strip() or type(exc).__name__,\n                )\n                raise\n'''
          if text.count(old) != 1:
              raise RuntimeError('expected exactly one rich retry block')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')

          test_path = Path('tests/test_analyst_workflow_observability.py')
          test_path.write_text('''from __future__ import annotations\n\nfrom pathlib import Path\n\nimport httpx\nimport pytest\n\nimport yandex_analytics_reaper.analyst_workflow as workflow\n\n\nclass _FakeClient:\n    def __init__(self, **kwargs: object) -> None:\n        del kwargs\n\n    def __enter__(self) -> _FakeClient:\n        return self\n\n    def __exit__(self, exc_type: object, exc: object, tb: object) -> None:\n        del exc_type, exc, tb\n\n\nclass _TransportFailingCollector:\n    def __init__(self, **kwargs: object) -> None:\n        del kwargs\n\n    def collect(self, app_ids: object) -> object:\n        del app_ids\n        raise httpx.ConnectError("synthetic transport failure")\n\n\nclass _SemanticFailingCollector:\n    def __init__(self, **kwargs: object) -> None:\n        del kwargs\n\n    def collect(self, app_ids: object) -> object:\n        del app_ids\n        raise ValueError("synthetic semantic failure")\n\n\nclass _Events:\n    def __init__(self) -> None:\n        self.records: list[tuple[str, dict[str, object]]] = []\n\n    def emit(self, event: str, *, stage: str, **context: object) -> None:\n        self.records.append((event, {"stage": stage, **context}))\n\n\nclass _Timings:\n    def __init__(self) -> None:\n        self.retries: list[dict[str, object]] = []\n\n    def record_retry(self, **context: object) -> None:\n        self.retries.append(context)\n\n    def record_rich_batch(self, **context: object) -> None:\n        raise AssertionError(f"unexpected successful batch timing: {context}")\n\n\ndef _call_failing_batch(\n    tmp_path: Path,\n    monkeypatch: pytest.MonkeyPatch,\n    collector: type[object],\n) -> tuple[_Events, _Timings]:\n    monkeypatch.setattr(workflow, "YandexPublicClient", _FakeClient)\n    monkeypatch.setattr(workflow, "YandexRichMetadataCollector", collector)\n    events = _Events()\n    timings = _Timings()\n    runner = workflow.AnalystExperimentRunner(\n        repository_root=tmp_path,\n        sleeper=lambda _: None,\n    )\n\n    with pytest.raises(Exception):\n        runner._collect_rich_batch(\n            (10, 20),\n            raw_store=object(),\n            schema_registry=object(),\n            persistence=object(),\n            batch_index=1,\n            batch_total=1,\n            events=events,\n            timings=timings,\n        )\n    return events, timings\n\n\ndef test_rich_terminal_transport_failure_reports_final_attempt(\n    tmp_path: Path,\n    monkeypatch: pytest.MonkeyPatch,\n) -> None:\n    events, timings = _call_failing_batch(\n        tmp_path,\n        monkeypatch,\n        _TransportFailingCollector,\n    )\n\n    assert [item[0] for item in events.records] == [\n        "rich_batch_started",\n        "rich_batch_retry",\n        "rich_batch_retry",\n        "rich_batch_failed",\n    ]\n    failure = events.records[-1][1]\n    assert failure["attempt"] == 3\n    assert failure["max_attempts"] == 3\n    assert len(timings.retries) == 2\n\n\ndef test_rich_semantic_failure_reports_first_attempt_without_retry(\n    tmp_path: Path,\n    monkeypatch: pytest.MonkeyPatch,\n) -> None:\n    events, timings = _call_failing_batch(\n        tmp_path,\n        monkeypatch,\n        _SemanticFailingCollector,\n    )\n\n    assert [item[0] for item in events.records] == [\n        "rich_batch_started",\n        "rich_batch_failed",\n    ]\n    failure = events.records[-1][1]\n    assert failure["attempt"] == 1\n    assert failure["max_attempts"] == 3\n    assert timings.retries == []\n''', encoding='utf-8')
          PY
      - name: Install exact dev environment
        run: |
          python -m pip install "pip==26.2.1"
          pip install -c constraints-dev.txt -e ".[dev]"
      - name: Ruff
        run: ruff check .
      - name: Mypy
        run: mypy src
      - name: Pytest and coverage
        run: pytest --cov=yandex_analytics_reaper --cov-report=term-missing --cov-fail-under=80
      - name: Commit reviewed fix
        shell: bash
        run: |
          rm -f .github/workflows/pr-a-review-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix: preserve rich failure attempt context"
          git push origin HEAD:feat/analyst-runner-v1.2-observability
