name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            constraints-dev.txt
      - run: python -m pip install "pip==26.2.1"
      - run: pip install -c constraints-dev.txt -e ".[dev]"
      - run: ruff check .
      - run: mypy src
      - run: pytest --cov=yandex_analytics_reaper --cov-report=term-missing --cov-fail-under=80
