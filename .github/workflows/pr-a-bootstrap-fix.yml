name: PR A bootstrap fixed

on:
  push:
    branches:
      - feat/analyst-runner-v1.2-observability

permissions:
  contents: write

jobs:
  implement-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/analyst-runner-v1.2-observability
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            constraints-dev.txt
      - name: Apply PR A integration patch
        shell: bash
        run: |
          python - <<'PY'
          import base64
          import gzip
          import re
          from pathlib import Path

          workflow = Path('.github/workflows/pr-a-bootstrap.yml').read_text(encoding='utf-8')
          match = re.search(r'^\s*payload = "([A-Za-z0-9+/=]+)"\s*$', workflow, re.MULTILINE)
          if match is None:
              raise RuntimeError('bootstrap payload not found')
          source = gzip.decompress(base64.b64decode(match.group(1))).decode('utf-8')
          namespace = {
              '__file__': str(Path.cwd() / 'scripts' / 'pr_a_apply.py'),
              '__name__': '__main__',
          }
          exec(compile(source, namespace['__file__'], 'exec'), namespace)

          coordinator = Path('src/yandex_analytics_reaper/analyst_workflow.py')
          text = coordinator.read_text(encoding='utf-8')
          old = '                        "packaged artifact manifest does not match the manifest built from the workdir"\n'
          new = (
              '                        "packaged artifact manifest does not match the manifest built "\n'
              '                        "from the workdir"\n'
          )
          if text.count(old) != 1:
              raise RuntimeError('expected one long artifact-manifest error line')
          coordinator.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Install exact dev environment
        run: |
          python -m pip install "pip==26.2.1"
          pip install -c constraints-dev.txt -e ".[dev]"
      - name: Ruff
        run: ruff check .
      - name: Mypy
        run: mypy src
      - name: Pytest and coverage
        run: pytest --cov=yandex_analytics_reaper --cov-report=term-missing --cov-fail-under=80
      - name: Commit verified implementation
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "feat: make analyst experiments observable"
          git push origin HEAD:feat/analyst-runner-v1.2-observability
