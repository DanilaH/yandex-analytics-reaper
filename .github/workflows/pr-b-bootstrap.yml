name: PR B bootstrap

on:
  push:
    branches:
      - feat/analyst-runner-v1.2-resume

permissions:
  contents: write

jobs:
  implement-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/analyst-runner-v1.2-resume
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            constraints-dev.txt
      - name: Repair bootstrap assumptions and generate PR B tree
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          bootstrap = Path('scripts/pr_b_bootstrap.py')
          text = bootstrap.read_text(encoding='utf-8')

          # The real builder fixtures live in tests/test_comparable_sets.py.
          text, count = re.subn(
              r'\n    # Narrow probe lookup \+ validator coverage extends existing fixtures without source I/O\..*?    test_path\.write_text\(text, encoding="utf-8"\)\n',
              '\n',
              text,
              count=1,
              flags=re.DOTALL,
          )
          if count != 1:
              raise RuntimeError('could not remove stale invented comparable fixture block')

          # PR A's formatter is line-oriented; keep only the signature patch here and
          # add the resume line structurally after generation.
          text, count = re.subn(
              r'\n    replace_once\(\n        path,\n        "    parts\.append\(f\\"workdir=\{workdir\}\\"\)\\n    return \\"; \\"\.join\(parts\)\\n",.*?\n    \)\n',
              '\n',
              text,
              count=1,
              flags=re.DOTALL,
          )
          if count != 1:
              raise RuntimeError('could not remove stale formatter-body patch')

          old_timing_patch = "replace_once(path, '                invocation_mode=\"run\",\\n', '                invocation_mode=invocation_mode,\\n')"
          new_timing_patch = "replace_once(path, '            invocation_mode=\"run\",\\n', '            invocation_mode=invocation_mode,\\n')"
          if text.count(old_timing_patch) != 1:
              raise RuntimeError('expected one stale timing-report indentation patch')
          text = text.replace(old_timing_patch, new_timing_patch, 1)
          bootstrap.write_text(text, encoding='utf-8')
          PY

          python scripts/pr_b_bootstrap.py

          python - <<'PY'
          from pathlib import Path
          import re

          runtime = Path('src/yandex_analytics_reaper/experiment_runtime.py')
          runtime_text = runtime.read_text(encoding='utf-8')
          old = '        ("workdir_preserved", workdir),\n    )\n'
          new = '        ("workdir_preserved", workdir),\n        ("resume", resume_command),\n    )\n'
          if runtime_text.count(old) != 1:
              raise RuntimeError('expected one line-oriented failure formatter tuple')
          runtime.write_text(runtime_text.replace(old, new, 1), encoding='utf-8')

          workflow = Path('src/yandex_analytics_reaper/analyst_workflow.py')
          text = workflow.read_text(encoding='utf-8')

          # Do not mislabel page count as listing count on a reused query.
          text, count = re.subn(
              r'\n\s*listing_count=_organic_listing_count\(reusable, raw_store\),',
              '',
              text,
              count=1,
          )
          if count != 1:
              raise RuntimeError('expected reused-query pseudo listing count')
          text, count = re.subn(
              r'\n\ndef _organic_listing_count\(record: object, raw_store: FilesystemRawSnapshotStore\) -> int:.*?\n\ndef _result_from_existing_artifact',
              '\n\ndef _result_from_existing_artifact',
              text,
              count=1,
              flags=re.DOTALL,
          )
          if count != 1:
              raise RuntimeError('expected pseudo listing-count helper')

          # Normalize all recovery/runtime setup errors into the public experiment error.
          text = text.replace(
              '        except (ExperimentRecoveryError, OSError, ValueError) as exc:\n',
              '        except Exception as exc:\n',
              1,
          )
          text = text.replace('    ExperimentRecoveryError,\n', '', 1)

          # Existing final ZIP corruption must fail closed with an explicit no-overwrite message.
          text = text.replace(
              '    except (BadZipFile, KeyError, OSError, ValueError) as exc:\n',
              '    except (AnalystExperimentError, BadZipFile, KeyError, OSError, ValueError) as exc:\n',
              1,
          )
          workflow.write_text(text, encoding='utf-8')

          tests = Path('tests/test_comparable_sets.py')
          tests.write_text(
              tests.read_text(encoding='utf-8').rstrip()
              + '''\n\n\ndef test_recovery_lookup_and_validator_reuse_exact_completed_run(tmp_path: Path) -> None:\n    family, comparable_set, raw_store, probe_store = _build_fixture(tmp_path)\n    first_ref = comparable_set.runs[0]\n    first = probe_store.get_run(first_ref.probe_run_id)\n    assert first is not None\n\n    candidates = probe_store.find_search_runs(\n        query_text=first_ref.query_text,\n        context=first.context,\n        requested_page_limit=first.run.requested_page_limit,\n    )\n    assert [item.run.id for item in candidates] == [first_ref.probe_run_id]\n\n    validated = YandexSearchComparableSetBuilder(\n        raw_store=raw_store,\n        probe_store=probe_store,\n    ).validate_reusable_run(\n        first_ref.probe_run_id,\n        query_text=first_ref.query_text,\n        expected_context=first.context,\n        requested_page_limit=first.run.requested_page_limit,\n    )\n    assert validated == first\n    assert family.members[0].query_text == first_ref.query_text\n\n\ndef test_recovery_validator_rejects_completed_run_with_tampered_raw_query(\n    tmp_path: Path,\n) -> None:\n    raw_store = FilesystemRawSnapshotStore(tmp_path / "raw")\n    probe_store = SQLiteProbeRunStore(tmp_path / "market.sqlite3")\n    run_id = _persist_search_run(\n        raw_store=raw_store,\n        probe_store=probe_store,\n        query="merge",\n        raw_query="different",\n        started_at=datetime(2026, 8, 29, 9, 0, tzinfo=UTC),\n        pages=((10,),),\n        requested_page_limit=1,\n    )\n    record = probe_store.get_run(run_id)\n    assert record is not None\n\n    with pytest.raises(ComparableSetConstructionError, match="raw query"):\n        YandexSearchComparableSetBuilder(\n            raw_store=raw_store,\n            probe_store=probe_store,\n        ).validate_reusable_run(\n            run_id,\n            query_text="merge",\n            expected_context=record.context,\n            requested_page_limit=1,\n        )\n''',
              encoding='utf-8',
          )
          PY

          python -m compileall -q src
      - name: Install exact dev environment
        run: |
          python -m pip install "pip==26.2.1"
          pip install -c constraints-dev.txt -e ".[dev]"
      - name: Ruff
        run: ruff check .
      - name: Mypy
        run: mypy src
      - name: Pytest and coverage
        run: pytest --cov=yandex_analytics_reaper --cov-report=term-missing --cov-fail-under=80
      - name: Commit verified PR B implementation
        shell: bash
        run: |
          rm -f .github/workflows/pr-b-bootstrap.yml scripts/pr_b_bootstrap.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "feat: add deterministic experiment resume"
          git push origin HEAD:feat/analyst-runner-v1.2-resume
