name: Giga Mega Young Outlier Scan

on:
  push:
    branches:
      - research/giga-mega-super-bank-2026-09-14
    paths:
      - .github/workflows/_giga-mega-young-outliers.yml

permissions:
  contents: read

jobs:
  young-outliers:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - name: Collect bounded feed sample and enrich recent listings
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations
          import hashlib, json
          from datetime import UTC, datetime
          from pathlib import Path
          from yandex_analytics_reaper.domain.models import ProbeContext
          from yandex_analytics_reaper.sources.yandex.client import YandexPublicClient
          from yandex_analytics_reaper.sources.yandex.parsers import YandexFeedParser, YandexGetGamesParser

          root = Path('/tmp/young-outliers'); raw = root / 'raw'; raw.mkdir(parents=True)
          context = ProbeContext(); feed_parser = YandexFeedParser(); games_parser = YandexGetGamesParser()
          cards = {}; pages = []; page_id = None; rtx_reqid = None
          def save(name, response):
              (raw / f'{name}.body').write_bytes(response.body)
              (raw / f'{name}.json').write_text(json.dumps({
                  'source_id': response.source_id, 'request_key': response.request_key,
                  'method': response.method, 'url': response.url, 'status_code': response.status_code,
                  'retrieved_at': response.retrieved_at.isoformat(), 'request_context': response.request_context,
                  'body_size': len(response.body), 'body_sha256': hashlib.sha256(response.body).hexdigest()
              }, ensure_ascii=False, indent=2, sort_keys=True) + '\n', encoding='utf-8')
          with YandexPublicClient() as client:
              for i in range(1, 6):
                  response = client.collect_feed(context, count=100, page_id=page_id, rtx_reqid=rtx_reqid)
                  save(f'feed-{i:02d}', response)
                  if response.status_code >= 400: raise RuntimeError(f'feed HTTP {response.status_code}')
                  page = feed_parser.parse(response.body); organic = [g for g in page.games if not g.sponsored]
                  for game in organic: cards.setdefault(game.app_id, game)
                  pages.append({'page': i, 'organic_games': len(organic), 'unique_organic_so_far': len(cards), 'has_next_page': page.page_info.has_next_page})
                  if not page.page_info.has_next_page or not page.page_info.next_page_id: break
                  page_id = page.page_info.next_page_id; rtx_reqid = page.page_info.rtx_reqid
              ids = sorted(cards); details = []
              for batch_no, start in enumerate(range(0, len(ids), 100), 1):
                  response = client.collect_games(ids[start:start+100]); save(f'get-games-{batch_no:02d}', response)
                  if response.status_code >= 400: raise RuntimeError(f'get_games HTTP {response.status_code}')
                  details.extend(games_parser.parse(response.body).games)
          now = datetime.now(UTC); rows = []
          for game in details:
              if game.first_published is None: continue
              stamp = float(game.first_published); stamp = stamp / 1000 if stamp > 10_000_000_000 else stamp
              try: published = datetime.fromtimestamp(stamp, tz=UTC)
              except (OverflowError, OSError, ValueError): continue
              age = max((now - published).total_seconds()/86400, 0.0)
              if age > 90: continue
              count = game.rating_count; pace = count / age if count is not None and age > 0 else None
              rows.append({'app_id': game.app_id, 'title': game.title, 'first_published': published.isoformat(),
                  'age_days': round(age,4), 'rating_count': count, 'player_rating': game.player_rating,
                  'lifetime_rating_count_per_day_proxy': round(pace,6) if pace is not None else None,
                  'categories_names': list(game.categories_names), 'description': game.description, 'instruction': game.instruction})
          rows.sort(key=lambda r: (r['lifetime_rating_count_per_day_proxy'] is not None, r['lifetime_rating_count_per_day_proxy'] or -1, r['rating_count'] or -1), reverse=True)
          payload = {'spec_version':'feed-young-outlier-scan-v1','observed_at':now.isoformat(),
              'scope':{'surface':'yandex catalogue feed','session_profile':'clean_anonymous','requested_pages':5,'games_per_page':100,'actual_pages':len(pages),'unique_organic_feed_ids':len(cards),'get_games_returned':len(details)},
              'limitations':['feed-sampled only; not a platform-wide census','lifetime ratingCount/day is a normalization proxy, not current growth','feed exposure is context-dependent and is not demand by itself','missing get_games IDs are uncertainty, not zero/deletion'],
              'feed_pages':pages,'recent_90d':rows,'top_30d':[r for r in rows if r['age_days']<=30][:40],
              'top_60d':[r for r in rows if r['age_days']<=60][:40],'top_90d':rows[:60]}
          (root/'young-outliers.json').write_text(json.dumps(payload,ensure_ascii=False,indent=2,sort_keys=True)+'\n',encoding='utf-8')
          print(json.dumps({'pages':len(pages),'unique_feed_ids':len(cards),'returned':len(details),'recent_90d':len(rows),'top':rows[:20]},ensure_ascii=False,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: giga-mega-young-outliers-2026-09-14
          path: /tmp/young-outliers
          if-no-files-found: error
          retention-days: 30
