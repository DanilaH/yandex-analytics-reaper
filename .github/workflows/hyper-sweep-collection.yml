name: Hyper Sweep bounded research (temporary)
on:
  push:
    branches:
      - research/hyper-sweep-2026-09-16
    paths:
      - .github/workflows/hyper-sweep-collection.yml

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install existing Reaper
        run: python -m pip install -e .
      - name: Bounded suite collection and offline verified intelligence
        run: |
          mkdir -p data/hyper-sweep-output
          set -o pipefail
          yandex-reaper-thesis run research/hyper-sweep-2026-09-16/suite.json --workers 2 | tee data/hyper-sweep-output/result.json
      - name: Inventory raw and intelligence artifacts
        if: always()
        run: |
          find data -type f -printf '%p %s bytes\n' | sort | head -100
          find data -type f -name '*.zip' -exec sha256sum {} \;
      - name: Preserve immutable artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hyper-sweep-2026-09-16-raw-and-intelligence
          path: data/
          if-no-files-found: warn
          retention-days: 30
